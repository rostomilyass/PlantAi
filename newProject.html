<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset = "UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PlanitAI - making your plan from step one.</title>
    <meta name="description" content="PlanitAI le site où en t'aide planifier ton briefe.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- Thème Tailwind : couleurs et polices du site -->
  <style type="text/tailwindcss">
    @theme {
      --color-bone: #E4E4DE;
      --color-lichen: #C4C5BA;
      --color-moss: #595F39;
      --color-forest: #1e2619;
      --color-forest-hi: #2B3524;
      --color-seed: #D39A2F;
      --color-ink: #1B1B1B;
      --color-paper: #F1F1EC;
      --font-display: "Fraunces", Georgia, serif;
      --font-body: "Instrument Sans", system-ui, sans-serif;
      
    }
    body { font-family: var(--font-body); }
    :focus-visible { outline: 2px solid var(--color-seed); outline-offset: 3px; }
  </style>
</head>
<body class = "bg-bone text-ink antialiased">
    <header>
        <aside id="default-sidebar" class="fixed top-0 left-0 z-40 w-64 h-full transition-transform -translate-x-full sm:translate-x-0 bg-forest text-bone flex flex-col" aria-label="Sidebar">
            <div class="px-6 pb-6 pt-8">
                <a href="index.html" class="font-display text-3xl tracking-tight">Planit<span class="text-seed">AI</span></a>
                <p class="mt-1 text-sm text-lichen/80">Plan it before you build it.</p>
            </div>              

            <nav class = "px-3 flex-1 ">  
                <ul class="space-y-1 font-medium">
                    <li>
                        <a href="index.html" class="flex items-center px-2 py-1.5 text-body rounded-base hover:bg-neutral-tertiary hover:text-fg-brand group">
                        <svg class="shrink-0 w-5 h-5 transition duration-75 group-hover:text-fg-brand" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6.025A7.5 7.5 0 1 0 17.975 14H10V6.025Z"/><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.5 3c-.169 0-.334.014-.5.025V11h7.975c.011-.166.025-.331.025-.5A7.5 7.5 0 0 0 13.5 3Z"/></svg>
                        <span class="ms-3">Dashboard</span>
                        </a>
                    </li>
                    <li>
                        <a href="newProject.html" aria-current="page" class="flex items-center gap-3 px-3 py-2.5 text-paper rounded-lg bg-forest-hi">
                        <svg class="w-5 h-5 transition duration-75 group-hover:text-fg-brand" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v14M9 5v14M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z"/></svg>
                        <span class="flex-1 ms-3 whitespace-nowrap text-text">New project</span>
                        </a>
                    </li>
                    <li>
                        <a href="parametres.html" class="flex items-center px-2 py-1.5 text-body rounded-base hover:bg-neutral-tertiary hover:text-fg-brand group">
                        <svg class="shrink-0 w-5 h-5 transition duration-75 group-hover:text-fg-brand" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="M16 19h4a1 1 0 0 0 1-1v-1a3 3 0 0 0-3-3h-2m-2.236-4a3 3 0 1 0 0-4M3 18v-1a3 3 0 0 1 3-3h4a3 3 0 0 1 3 3v1a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Zm8-10a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg>
                        <span class="flex-1 ms-3 whitespace-nowrap">Parametres Ai</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>
    </header>
    <main class = "ml-64 ">
        <div class ="w-full max-w">
            <form class="bg-bone shadow-md rounded px-20 pt-6 pb-8" data-parsley-validate>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="projectName">Ton nom de projet : </label>
                    <input class="shadow appearance-none border rounded w-full py-2 px-3 bg-white text-gray-700 leading-tight focus:outline-none focus:shadow-outilne" id="projectName" type="text" placeholder="name project" data-parsley-required="true" data-parsley-required-message="Ce champ est obligatoire.">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="description">Description : </label>
                    <input class="shadow appearance-none border rounded w-full py-2 px-3 bg-white text-gray-700 leading-tight focus:outline-none focus:shadow-outilne" id="description" type="text" placeholder="description" data-parsley-required="true" data-parsley-required-message="Ce champ est obligatoire.">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="duree">Durée (en jours) : </label>
                    <input class="shadow appearance-none border rounded w-full py-2 px-3 bg-white text-gray-700 leading-tight focus:outline-none focus:shadow-outilne" id="duree" type="number" placeholder="durée(en jours)" data-parsley-required="true" data-parsley-required-message="Ce champ est obligatoire."data-parsley-min="1" data-parsley-min-message="il faut au minimum plus d'un jour.">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="developpeur">Nombre de développeurs : </label>
                    <input class="shadow appearance-none border rounded w-full py-2 px-3 bg-white text-gray-700 leading-tight focus:outline-none focus:shadow-outilne" id="nbrDev" type="number" placeholder="nombre de dev" data-parsley-required="true" data-parsley-required-message="Ce champ est obligatoire." data-parsley-min="1" data-parsley-min-message="il faut au minimum un developpeur">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="technologieUsed">Technologies utilisées : </label>
                    <input class="shadow appearance-none border rounded w-full py-2 px-3 bg-white text-gray-700 leading-tight focus:outline-none focus:shadow-outilne" id="techUsed" type="text" placeholder="tech utilisées" data-parsley-required="true" data-parsley-required-message="Ce champ est obligatoire.">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="technologieUsed">Niveau de difficulté : </label>
                    <select class="shadow appearance-none border rounded w-full py-2 px-3 bg-white text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="diffNiv" data-parsley-required="true" data-parsley-required-message="Ce champ est obligatoire.">
                        <option value="" disabled selected>Select a level</option>
                        <option value="beginner">Beginner</option>
                        <option value="intermediate">Intermediate</option>
                        <option value="advanced">Advanced</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="briefComplet">Brief complet : </label>
                    <textarea class="shadow appearance-none border rounded w-full bg-white py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="briefComplet" rows="5" placeholder="Décrivez votre brief complet" data-parsley-required="true" data-parsley-required-message="Ce champ est obligatoire."></textarea>
                </div>
                <div class="flex justify-center">
                    <button class=" bg-seed hover:bg-seed/90 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline" type="submit">
                        Générer le plan de développement
                    </button>
                </div>    
            </form>
        </div>
    </main>
<script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/parsleyjs@2.9.2/dist/parsley.min.js"></script>
</body>

</html>
